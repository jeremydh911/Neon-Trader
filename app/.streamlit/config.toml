[theme]
primaryColor = "#c9a227"
backgroundColor = "#07090f"
secondaryBackgroundColor = "#121824"
textColor = "#fafafa"
font = "sans serif"

[client]
showErrorDetails = true
showColormapSelector = true
toolbarMode = "viewer"

[logger]
level = "info"

[server]
port = 8501
headless = true
runOnSave = false
maxUploadSize = 200
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[ui]
hideTopBar = false
hideSidebarNav = false
