name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          PAPER_MODE: "1"
          USE_MOCK_BROKER: "1"
          OTLP_ENABLED: "false"
        run: |
          pytest -q tests

      - name: Smoke + paper cycle
        env:
          PYTHONPATH: ${{ github.workspace }}
          PAPER_MODE: "1"
          USE_MOCK_BROKER: "1"
          OTLP_ENABLED: "false"
        run: |
          python -c "import importlib; importlib.import_module('app')"
          python scripts/smoke_autonomous_trade.py
          python scripts/paper_cycle.py

  container-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build CPU test image
        run: |
          docker build -f docker/cpu/Dockerfile -t neon-trader-test:latest .

      - name: Run paper cycle inside container
        run: |
          docker run --rm \
            -e PYTHONPATH=/workspace \
            -e PAPER_MODE=1 \
            -e USE_MOCK_BROKER=1 \
            -e OTLP_ENABLED=false \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            neon-trader-test:latest \
            python scripts/paper_cycle.py
