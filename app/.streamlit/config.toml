[theme]
primaryColor = "#5eead4"
backgroundColor = "#071018"
secondaryBackgroundColor = "#0c1a22"
textColor = "#eef6f8"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "viewer"

[logger]
level = "info"

[server]
port = 8501
headless = true
runOnSave = false
maxUploadSize = 200
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[ui]
hideTopBar = false
hideSidebarNav = false
