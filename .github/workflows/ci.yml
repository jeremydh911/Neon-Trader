name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest

      - name: Run tests
        run: |
          pytest -q tests

      - name: Smoke test import & script
        run: |
          python -c "import importlib; importlib.import_module('app')"
          python scripts/smoke_autonomous_trade.py || true

  container-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build CPU test image
        run: |
          docker build -f docker/cpu/Dockerfile -t neon-trader-test:latest .

      - name: Run smoke script inside container
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace neon-trader-test:latest python scripts/smoke_autonomous_trade.py || true
